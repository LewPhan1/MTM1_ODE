# Edit this file, then restart the notebook and Run All.
# Values preserve the supplied notebook's calculations.
affinities:
  Kd_SA: 3160          # nM; Snx17–PI(3)P
  Kd_MA: 58525.75835630174 #47358.5       # nM; MTM1–PI(3)P (13531 * 3.5)
  Kd_PA: 457           # nM; probe–PI(3)P
  Kd_PB: 45700         # nM; probe–PI
  Kd_SM: 17.105506569930213 #150            # molecules/um2; Snx17–MTM1
  Kd_SC: 15 #150           # molecules/um2; Snx17–cargo
  Kd_MM_2D: 0.6        # molecules/um2; MTM1 dimer (150 / 250)
  Kd_MM_3D: 100        # nM; solution MTM1 dimer

geometry:
  Volume: 20000000000.0   # um3; 20 uL
  TotalMembraneSA: 19100883  # um2

association_rates:
  kon_SA: 0.000034     # nM^-1 s^-1
  kon_MA: 0.000034     # nM^-1 s^-1
  kon_PA: 0.00034      # nM^-1 s^-1
  kon_PB: 0.000034     # nM^-1 s^-1
  kon_SM: 0.00574      # um2 molecule^-1 s^-1
  kon_SC: 0.00574      # um2 molecule^-1 s^-1
  kon_MMa: 0.00574     # um2 molecule^-1 s^-1
  kon_MMf: 0.000034    # nM^-1 s^-1
  kon_MAM: 0.000034    # nM^-1 s^-1

# Preserve the original reference-scaled koff calculation:
# koff = reference koff * (configured Kd / reference Kd).
# These reference values are independent of the configured kon values.
dissociation_reference:
  bulk_Kd: 2700        # nM
  bulk_koff: 0.093     # s^-1
  probe_A_koff: 0.93   # s^-1
  surface_Kd: 150      # molecules/um2
  surface_koff: 0.861  # s^-1

complex_off_rate_divisors:
  SAM: 10             # koff_SAM = koff_SA / SAM
  SAC: 10             # koff_SAC = koff_SA / SAC
  MAM: 10             # koff_MAM = koff_MA / MAM

catalysis:
  keff_M: 0.0024482    # nM^-1 s^-1 for the current rate law
  keff_SM: null        # null means use keff_M; or enter a separate number
  keff_MM: null        # null means use keff_M; or enter a separate number

transport:
  ka: 0.1             # s^-1; acts only on undelivered states

membrane:
  PC_concentration: 1600  # nM; original concentration scaling
  membrane_substrate: 0.05  # fraction; 0.05 = 5%
  membrane_product: 0.0     # fraction

equilibration:
  Snx17_conc: 0      # nM
  MTM1_conc: 0         # nM
  Probe_conc: 25       # nM
  cargo_fraction: 0.01 # fraction of PC_concentration, not nM
  time_s: [0, 500]

# Original assay initialisation/overwrite logic is retained.
assay:
  Snx17_conc: 0        # nM
  MTM1_conc: 25        # nM
  Probe_conc: 0        # nM
  time_s: [0, 1200]

solver:
  method: RK45
  max_step: 0.01       # seconds
  rtol: 0.001          # original SciPy default
  atol: 0.000001       # original SciPy default

files:
  experimental_csv: OptionC_time_50M_25M_50MS_25MS.csv #cargo_for_plot.csv  # relative to this YAML file
  results_csv: results.csv              # relative to this YAML file
  time_column: time (min)
  time_to_seconds: 60
  WT_column: 25nM MTM1 #WT
  AAAA_column: 25nM MTM1 + 300nM Snx17 #AAAA
